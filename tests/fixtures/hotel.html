<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel layout fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;font:12px Arial,sans-serif;color:#eee;height:100vh;overflow:hidden}.hotel-sidebar{position:fixed;top:12px;right:10px;width:200px;display:flex;flex-direction:column;gap:8px}.hotel-counter{padding:7px;border:1px solid #62676c;border-radius:4px;background:#25272b}.nitro-notification-bubble{width:100%;background:#25272b;border:1px solid #62676c;border-radius:5px;padding:6px}.native-radio-toggle{display:flex;justify-content:space-between;align-items:center;color:inherit;background:none;border:0;width:100%;padding:0;text-align:left;font-size:11px;cursor:pointer}.radio-item{display:flex;align-items:center;gap:8px;height:52px}.native-avatar{width:32px;height:32px;background:#71767d;border-radius:50%}.native-volume{height:5px;width:90px;background:#ddd;border-radius:8px}.hotel-notice{padding:10px;line-height:1.4}.hotel-bottom{position:fixed;bottom:0;height:55px;border-top:1px solid #666;background:#272a2d;width:100%;padding:16px}.chat-input{position:fixed;bottom:65px;left:35%;width:30%;height:34px;border:0;border-radius:5px;padding:7px;background:#eee;color:#222}.room{position:absolute;inset:25% 32%;display:grid;place-items:center;color:#7b8189;border:1px solid #323841;border-radius:12px}button:focus-visible{outline:2px solid #ffab36}
</style></head><body>
<div class="room">Quarto do hotel · cenário de teste</div>
<aside class="hotel-sidebar"><div class="hotel-counter">Conchas <b>Info</b></div><div class="hotel-counter">Asinhas <b>1</b></div><div class="nitro-notification-bubble"><button class="native-radio-toggle" type="button" aria-expanded="true">RádioHabblet <span aria-hidden="true">⌃</span></button><div class="radio-item"><div class="native-avatar"></div><div class="native-volume"></div><audio id="original"></audio></div></div><div class="nitro-notification-bubble hotel-notice">As conversas nos quartos podem ser monitoradas pela moderação.</div></aside>
<input class="chat-input" name="chat" maxlength="100" placeholder="Fale aqui…"><div class="hotel-bottom">Menu do hotel</div>
<script>document.querySelector('.native-radio-toggle').addEventListener('click',event=>{const button=event.currentTarget;const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));document.querySelector('.radio-item').hidden=expanded;});</script>
</body></html>
